name: CIO Agencial Bot

on:
  schedule:
    - cron: '0 0 * * *' # Se ejecuta todos los días a las 00:00 UTC
  workflow_dispatch: # Permite ejecutarlo manualmente desde la web de GitHub

# --- CONFIGURACIÓN CRÍTICA DE PERMISOS ---
permissions:
  contents: write

# Evita ejecutar múltiples instancias simultáneamente del mismo workflow
concurrency:
  group: trader-bot
  cancel-in-progress: false

jobs:
  run-trader:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install pandas numpy yfinance groq alpaca-py; fi

    - name: Ejecutar script de trading
      env:
        APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
        APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      run: |
        python trader.py

    - name: Guardar cambios del CSV en el repositorio
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        
        # 1. Guardar temporalmente el CSV modificado para limpiar el working directory
        git stash
        
        # 2. Traer cambios remotos y rebasear limpiamente
        git fetch origin main
        git rebase origin/main || { git rebase --abort; git stash pop; exit 1; }
        
        # 3. Restaurar nuestro CSV modificado
        git stash pop || true
        
        git status
        git add trades_history.csv

        if ! git diff --cached --quiet; then
          echo "✅ Cambios detectados. Haciendo commit y push..."
          git commit -m "chore: actualizacion automatica de trades_history.csv [skip ci]"
          git push origin HEAD:main
          echo "✅ Push exitoso"
        else
          echo "ℹ️ Sin cambios en trades_history.csv"
        fi