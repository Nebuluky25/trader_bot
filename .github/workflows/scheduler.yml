name: Automatizacion Diaria Llama 3

on:
  schedule:
    - cron: '0 8 * * *' # Se ejecuta todos los días a las 08:00 AM UTC
  workflow_dispatch: # Permite ejecutarlo manualmente desde la web de GitHub

permissions:
  contents: write

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance requests groq alpaca-py
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Ejecutar Script de Trading
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: |
          python trader.py

      - name: Guardar cambios de CSV en GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git status
          git add trades_history.csv || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "📊 Actualización automática del CSV del bot [skip ci]" && git push)