name: Grok Daily Trader

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trader-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install matplotlib
          python -c "import matplotlib.pyplot; print('matplotlib OK')"

      - name: Ejecutar script de trading
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: python trader.py

      - name: Guardar y sincronizar cambios en el CSV
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add trades_history.csv
          if ! git diff --staged --quiet; then
            git commit -m "Actualización automática de historial de trades [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          else
            echo "Sin cambios en trades_history.csv"
          fi
