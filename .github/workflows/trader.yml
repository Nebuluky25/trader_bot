name: Grok Daily Trader

on:
  schedule:
    - cron: '0 9 * * *' # Se ejecuta todos los días a las 09:00 UTC
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña Actions de GitHub

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install requests pandas numpy yfinance

      - name: Ejecutar script de trading
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }} # 👈 AQUÍ ES DONDE SE CONECTA EL SECRET
        run: |
          python trader.py